<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Белка Онлайн</title>

<script src="https://yandex.ru/games/sdk/v2" onerror="window.YaGames=undefined"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #2e7d32, #1b5e20);
  font-family: Arial;
  overflow: hidden;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
}

.card {
  width: 70px;
  margin: 5px;
  transition: transform 0.2s, opacity 0.3s;
  border-radius: 4px;
}

.card:hover {
  transform: translateY(-12px) scale(1.05);
}

#hand {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
}

#table {
  position: absolute;
  top: 38%;
  width: 100%;
  text-align: center;
}

.table-card {
  width: 80px;
  margin: 10px;
}

.player {
  position: absolute;
  color: white;
  font-size: 16px;
  transition: all 0.2s;
}

.player.top    { top: 20px; width: 100%; text-align: center; }
.player.left   { left: 20px; top: 50%; transform: translateY(-50%); }
.player.right  { right: 20px; top: 50%; transform: translateY(-50%); }

#result {
  position: absolute;
  top: 40%;
  width: 100%;
  text-align: center;
  font-size: 26px;
  color: white;
  display: none;
  background: rgba(0,0,0,0.6);
  padding: 20px 0;
}

#restart {
  margin-top: 16px;
  padding: 10px 24px;
  font-size: 17px;
  cursor: pointer;
  border-radius: 8px;
  border: none;
  background: #fff;
  color: #1b5e20;
  font-weight: bold;
}

#status {
  position: absolute;
  top: 48%;
  width: 100%;
  text-align: center;
  color: #fff176;
  font-size: 18px;
  pointer-events: none;
  display: none;
}

#trump {
  position: absolute;
  top: 10px;
  right: 10px;
  color: white;
  font-size: 20px;
  font-weight: bold;
}

#scores {
  position: absolute;
  top: 36px;
  right: 10px;
  color: white;
  font-size: 15px;
}

#roomCodeDisplay {
  position: absolute;
  top: 62px;
  right: 10px;
  color: #fff176;
  font-size: 18px;
  font-weight: bold;
  display: none;
}

.hud-left {
  position: absolute;
  top: 10px;
  left: 10px;
  color: white;
  line-height: 1.8;
  font-size: 14px;
}

.menu-buttons {
  position: absolute;
  top: 90px;
  left: 10px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.menu-buttons button {
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  border-radius: 6px;
  border: none;
  background: rgba(255,255,255,0.18);
  color: white;
  text-align: left;
}

.menu-buttons button:hover {
  background: rgba(255,255,255,0.32);
}

#startWithBots {
  display: none;
  background: rgba(255, 200, 0, 0.3) !important;
}
</style>
</head>

<body>
<div id="game">

  <!-- HUD левый -->
  <div class="hud-left">
    <div id="rating">Рейтинг: 1000</div>
    <div id="league">Лига: Серебро</div>
    <div id="coins">Монеты: 0</div>
  </div>

  <!-- HUD правый -->
  <div id="trump">Козырь: —</div>
  <div id="scores">Счёт: 0 : 0</div>
  <div id="roomCodeDisplay"></div>

  <!-- Меню -->
  <div class="menu-buttons">
    <button onclick="quickGame()">⚡ Быстрая игра (с ботами)</button>
    <button onclick="createRoom()">🏠 Создать комнату</button>
    <button onclick="joinRoom()">🔑 Войти по коду</button>
    <button id="startWithBots" onclick="startWithBots()">🤖 Начать с ботами</button>
    <button id="rewardAd">🎬 +100 монет (реклама)</button>
  </div>

  <!-- Статус -->
  <div id="status"></div>

  <!-- Игроки -->
  <div class="player top">Игрок 2</div>
  <div class="player left">Игрок 3</div>
  <div class="player right">Игрок 4</div>

  <!-- Стол и рука -->
  <div id="table"></div>
  <div id="hand"></div>

  <!-- Результат -->
  <div id="result">
    <div id="resultText"></div>
    <button id="restart">Играть ещё</button>
  </div>

</div>

<script src="main.js"></script>
</body>
</html>
